<!-- pagina com as informações individuais do jogo -->
 {% extends 'base.html' %}

 {% block content %}

 <div class="container" style="background-color: #f0f0f0; border-radius:8px;">
    <div class="row">
        <div class="col-md-6 m-auto">
            <!-- botao para voltar -->
             <a href="{{url_for('apigames')}}" class="btn btn-dark">Voltar para lista<a><br><br>
                <div class="card">
                    <!-- imagem do jogo -->
                     <img src="{{jogoInfo.thumbnail}}">
                     <!-- informações do jogo -->
                      <div class="card-body m-auto">
                        <h3>{{jogoInfo.title}}</h3>
                        <p>Gênero: {{jogoInfo.genre}}</p>
                        <p>Descrição: {{jogoInfo.short_description}}</p>
                        <p>Plataforma: {{jogoInfo.platform}}</p>
                        <p>Editora: {{jogoInfo.publisher}}</p>
                        <p>Data de Lançamento: {{jogoInfo.release_date}}</p>
                        <!-- botao para jogar -->
                            <a href="{{jogoInfo.freetogame_profile_url}}" class="btn btn-danger">Jogar</a>
                        </div>
                </div>
        </div>
    </div>
</div>

 {% endblock content %}
