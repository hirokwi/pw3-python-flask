{% extends 'base.html' %} {% block content %} {% with messages =
get_flashed_messages(with_categories=true) %} {% for category, message in
messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %} {% endwith %}

<div class="container">
  <div class="card mt-4">
    <div class="card-header">Login</div>

    <div class="card-body">
      <form action="{{ url_for('login') }}" method="post">
        <label for="email">E-mail</label>
        <input
          type="email"
          name="email"
          id="email"
          class="form-control"
          placeholder="Insira seu e-mail"
        />

        <label for="senha" class="mt-3">Senha</label>
        <input
          type="password"
          name="senha"
          id="senha"
          class="form-control"
          placeholder="Insira sua senha"
        />

        <button type="submit" class="btn btn-danger btn-block mt-3">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock content %}
