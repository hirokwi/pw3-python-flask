{% extends 'base.html' %}

{% block content %}

<h2>Cadastro de jogos</h2>
<hr>

<form action="{{url_for('cadgames')}}" method="POST" class="container-form">
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" placeholder="Insira o nome do jogo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Ano</label>
        <input type="text" name="ano" placeholder="Insira o ano do jogo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria</label>
        <input type="text" name="categoria" placeholder="Insira a categoria do jogo" class="form-control" required>
    </div>

    <div class="d-flex gap-2 mt-3">
        <input type="submit" value="Cadastrar" class="btn btn-success">
        <input type="reset" value="Limpar" class="btn btn-secondary">
    </div>
</form>

<hr>

<h4>Jogos Cadastrados</h4>
<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>Título</th>
            <th>Ano</th>
            <th>Categoria</th>
        </tr>
    </thead>
    <tbody>
        {% for game in listaGames %}
        <tr>
            <td>{{game.titulo}}</td>
            <td>{{game.ano}}</td>
            <td>{{game.categoria}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
