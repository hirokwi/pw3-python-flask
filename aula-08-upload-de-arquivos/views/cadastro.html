{% extends 'base.html' %}
{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

<div class="container-form">
    <div class="card">
        <div class="card-header">
            <h2>Cadastro do usuário</h2>
        </div>
        <div class="card-body">
            <form action="{{url_for('cadastro')}}" method="POST">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Insira seu e-mail" class="form-control" required>

                <label>Senha</label>
                <input type="password" name="senha" placeholder="Insira sua senha" class="form-control" required>

                <button type="submit" class="btn btn-danger btn-block mt-3">Cadastrar</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
